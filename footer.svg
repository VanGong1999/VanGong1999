<svg width="960" height="190" viewBox="0 0 960 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VanGong1999 GitHub footer</title>
  <desc id="desc">An animated neon footer with a pulsing heart and a Star Follow Connect message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="0.5" stop-color="#111A3A"/>
      <stop offset="1" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="960" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="2" y="2" width="956" height="186" rx="22"/></clipPath>
  </defs>

  <rect x="2" y="2" width="956" height="186" rx="22" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <circle cx="110" cy="35" r="2" fill="#67E8F9" opacity=".8">
      <animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="46" r="2" fill="#C4B5FD" opacity=".7">
      <animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="145" r="1.5" fill="#67E8F9">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M-80 155C170 90 330 205 570 135C760 80 860 120 1040 55" stroke="#22D3EE" stroke-opacity=".18" stroke-width="18"/>
    <path d="M-80 155C170 90 330 205 570 135C760 80 860 120 1040 55" stroke="#67E8F9" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="10 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <rect x="-260" y="0" width="110" height="190" fill="#67E8F9" opacity=".055" transform="skewX(-18)">
      <animate attributeName="x" from="-260" to="1050" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#glow)">
    <g transform="translate(178 66) scale(.42)" opacity=".9">
      <path d="M0 8C-11-7-38 0-38 20C-38 42 0 64 0 64C0 64 38 42 38 20C38 0 11-7 0 8Z" fill="#FB7185">
        <animateTransform attributeName="transform" type="scale" values=".9;1.18;.9" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(276 42) scale(.26)" opacity=".8">
      <path d="M0 8C-11-7-38 0-38 20C-38 42 0 64 0 64C0 64 38 42 38 20C38 0 11-7 0 8Z" fill="#F9A8D4">
        <animateTransform attributeName="transform" type="scale" values=".8;1.25;.8" dur="2.15s" begin=".35s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(684 43) scale(.28)" opacity=".8">
      <path d="M0 8C-11-7-38 0-38 20C-38 42 0 64 0 64C0 64 38 42 38 20C38 0 11-7 0 8Z" fill="#C4B5FD">
        <animateTransform attributeName="transform" type="scale" values=".85;1.22;.85" dur="2.35s" begin=".55s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(786 69) scale(.42)" opacity=".9">
      <path d="M0 8C-11-7-38 0-38 20C-38 42 0 64 0 64C0 64 38 42 38 20C38 0 11-7 0 8Z" fill="#FB7185">
        <animateTransform attributeName="transform" type="scale" values=".9;1.18;.9" dur="1.95s" begin=".2s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M480 51C469 36 442 43 442 64C442 86 480 108 480 108C480 108 518 86 518 64C518 43 491 36 480 51Z" fill="#FB7185">
      <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="1.25s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
  <text x="480" y="135" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Thanks for visiting</text>
  <text x="480" y="163" fill="#A5F3FC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" letter-spacing="2" text-anchor="middle">STAR  ·  FOLLOW  ·  CONNECT</text>
</svg>
