    <g stroke="#F8FAFC" stroke-width="1" stroke-linecap="round" opacity=".75">
      <g transform="translate(410 95)">
        <line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/>
        <animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/>
