    <g filter="url(#glow)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
      <text x="480" y="118" fill="#F8FAFC" font-size="24" font-weight="800" letter-spacing="0.6">👋 hello, I'm Van.G, AI Full-Stack Engineer</text>
      <text x="480" y="158" fill="#A5F3FC" font-size="16" font-weight="600" letter-spacing="2.5">Multi-Agent  ·  RAG  ·  Inference</text>
      <text x="480" y="188" fill="#94A3B8" font-size="13" font-weight="500" letter-spacing="1.2">Production Agent · AIGC · Beijing</text>
    </g>
  </g>

  <rect x="1" y="1" width="958" height="278" rx="18" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
